# Type check, lint, formatting, unit tests (against a throw-away PostgreSQL), production build,
# end-to-end tests and the dependency audit, on Node 22 (what the image ships with) and 24 (LTS
# until April 2028, so the image can move to it). Then the image is built and the compose stack
# (database, least-privilege role, wiki) is started and checked.
# Runs for pull requests, and for pushes to main as the first step of the Docker image workflow
# (which publishes only if all of this passes).
name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Checks and tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # the tests start their own throw-away PostgreSQL from the runner's preinstalled binaries
      - run: echo "PG_BIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)" >> "$GITHUB_ENV"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high

  docker:
    name: Image builds, compose stack starts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: tidewiki:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The compose stack starts (database, least-privilege role, wiki) and answers
        run: |
          cp .env.example .env
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=$(openssl rand -hex 24)|; s|^DB_ADMIN_PASSWORD=.*|DB_ADMIN_PASSWORD=$(openssl rand -hex 24)|" .env
          sed -i "s|image: astaldoo/tidewiki:latest|image: tidewiki:ci|" docker.yaml
          mkdir -p data backups && sudo chown 1000:1000 data backups
          docker compose -f docker.yaml up -d
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:3000/api/healthz && break; sleep 2; done
          curl -fsS http://127.0.0.1:3000/api/healthz
          docker exec tidewiki grep -E '^Uid:' /proc/1/status | awk '{ print; if ($3 != 1000) exit 1 }'   # effective uid
          docker logs tidewiki | grep -q "setup token"
          # the self-hosted fonts are in the image
          curl -fsS http://127.0.0.1:3000/fonts/manrope.css | grep -q "woff2"
          # the wiki's database user is not a superuser, and the database isn't published
          docker exec tidewiki-db psql -U postgres -d tidewiki -tAc "SELECT rolsuper FROM pg_roles WHERE rolname='tidewiki'" | grep -qx f
          ! nc -z 127.0.0.1 5432
      - if: failure()
        run: docker compose -f docker.yaml logs || true
